name: iOS IME regression and unsigned build

on:
  workflow_dispatch:
  push:
    branches: [fix/ios-wechat-ime-freeze]

permissions:
  contents: read

concurrency:
  group: ios-ime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # The shared Gradle modules apply AGP even for an iOS archive. SDK setup is configuration
      # only: this workflow never runs Android tests or builds an APK/AAB.
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ios-ime-konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ios-ime-konan-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Verify formatting and iOS regressions on JVM
        run: ./gradlew spotlessCheck :designsys:jvmTest :shared:jvmTest :ui:jvmTest
      - name: Run common tests on Kotlin Native
        run: ./gradlew :shared:macosArm64Test
      - name: Boot iOS test simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          iphones = [d for runtime, rows in devices.items() if '.iOS-' in runtime for d in rows if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not iphones:
              raise SystemExit('No available iPhone simulator')
          device = next((d for d in iphones if d['state'] == 'Booted'), iphones[0])
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('IOS_TEST_DEVICE=' + device['udid'] + '\n')
          print('Simulator:', device['name'], device['udid'])
          PY
      - name: Run iOS editor and SVG integration tests
        run: ./gradlew :designsys:iosSimulatorArm64Test :iosapp:iosSimulatorArm64Test -PiosTestDevice="$IOS_TEST_DEVICE"
      - name: Verify iOS integration tests executed
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for module, required in [('designsys', 'EditorTextFieldPlatformTest'), ('iosapp', 'WebKitSvgRasterizerTest')]:
              files = list(pathlib.Path(module, 'build/test-results/iosSimulatorArm64Test').glob('**/*.xml'))
              cases = [c for f in files for c in ET.parse(f).getroot().iter('testcase') if required in c.attrib.get('classname', '')]
              if not cases or any(c.find('skipped') is not None for c in cases):
                  raise SystemExit(required + ' did not execute')
              print(required, 'executed:', len(cases))
          PY
      - name: Build unsigned iOS test app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
        run: |
          xcodebuild \
            -project iosapp/Nodyssey.xcodeproj \
            -scheme Nodyssey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nodyssey.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.2.22-ime.2" \
            CURRENT_PROJECT_VERSION="53"
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Nodyssey.xcarchive/Products/Applications/Nodyssey.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry nodyssey-1.2.22-ime.2-unsigned.ipa Payload)
          shasum -a 256 "$RUNNER_TEMP/nodyssey-1.2.22-ime.2-unsigned.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: nodyssey-ios-ime-unsigned
          path: ${{ runner.temp }}/nodyssey-1.2.22-ime.2-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ime-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop Gradle daemons
        if: always()
        run: ./gradlew --stop
