name: Glass71 disposable iOS integration (no archive)
on:
  workflow_dispatch:
    inputs:
      archive:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  integration:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify installed SDK/runtime without downloads
        run: |
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
      - run: python3 iosapp/Glass71Diagnostic/stage.py
      - name: Compile smoke then actual iOS matrix
        run: python3 iosapp/Glass71Diagnostic/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: glass71-ios
          path: ${{ runner.temp }}/glass71-evidence
          retention-days: 7
          if-no-files-found: error
