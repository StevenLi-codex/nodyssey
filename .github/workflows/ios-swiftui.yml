name: Profile canvas diagnostic (no archive)
on:
  workflow_dispatch:
    inputs:
      archive:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  background:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 iosapp/HomeRowDiagnostic/stage.py
      - name: Real iOS canvas tests
        run: python3 iosapp/HomeRowDiagnostic/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profile-background
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: error
