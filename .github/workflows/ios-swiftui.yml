name: SwiftUI iOS build and native verification

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-swiftui-liquid-glass]
    paths:
      - 'iosapp/**'
      - 'shared/**'
      - 'richtext/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - '.github/workflows/ios-swiftui.yml'

permissions:
  contents: read

concurrency:
  group: ios-swiftui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Apple toolchain and simulator availability
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list devices available
          swift --version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ios-swiftui-konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ios-swiftui-konan-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Native core behavior tests
        run: |
          if test -f iosapp/NativeCore/Package.swift; then
            swift test --package-path iosapp/NativeCore
          else
            printf '%s\n' 'Baseline toolchain run: SwiftUI core not introduced in this revision.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile Kotlin iOS bridge and native tests
        run: ./gradlew :iosapp:compileKotlinIosSimulatorArm64 :iosapp:compileTestKotlinIosSimulatorArm64
      - name: Build simulator app
        run: |
          xcodebuild -project iosapp/Nodyssey.xcodeproj -scheme Nodyssey \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NodysseySimulator" \
            build CODE_SIGNING_ALLOWED=NO
      - name: Launch app in actual ARM simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [d for runtime, entries in devices.items() if '.iOS-' in runtime for d in entries if d['isAvailable'] and 'iPhone' in d['name']]
          if not phones:
              raise SystemExit('No available iPhone simulator: runtime acceptance is blocked')
          phone = phones[0]
          udid = phone['udid']
          if phone['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', udid], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True)
          app = os.environ['RUNNER_TEMP'] + '/NodysseySimulator/Build/Products/Debug-iphonesimulator/Nodyssey.app'
          subprocess.run(['xcrun', 'simctl', 'install', udid, app], check=True)
          subprocess.run(['xcrun', 'simctl', 'launch', udid, 'io.github.nodyssey'], check=True)
          subprocess.run(['xcrun', 'simctl', 'io', udid, 'screenshot', os.environ['RUNNER_TEMP'] + '/nodyssey-launch.png'], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('\nInstalled and launched on ' + phone['name'] + '. Launch alone is not full interaction/login acceptance.\n')
          PY
      - name: Build unsigned iPhone archive
        run: |
          xcodebuild -project iosapp/Nodyssey.xcodeproj -scheme Nodyssey \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nodyssey.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.2.22-swiftui.1" CURRENT_PROJECT_VERSION="54"
      - name: Package unsigned test IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Nodyssey.xcarchive/Products/Applications/Nodyssey.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry nodyssey-swiftui-unsigned.ipa Payload)
          shasum -a 256 "$RUNNER_TEMP/nodyssey-swiftui-unsigned.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: nodyssey-swiftui-unsigned
          path: ${{ runner.temp }}/nodyssey-swiftui-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nodyssey-swiftui-verification
          path: |
            ${{ runner.temp }}/nodyssey-launch.png
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop Gradle daemons
        if: always()
        run: ./gradlew --stop
