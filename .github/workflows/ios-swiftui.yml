name: Glass72 short real iOS top regression (no archive)
on:
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [baseline, candidate]
        default: baseline
      source_commit:
        type: string
        default: baede138d8bcef206ecc2d392c2038fd445633ec
permissions:
  contents: read
jobs:
  integration:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DIAG_SOURCE: ${{ inputs.source }}
      DIAG_COMMIT: ${{ inputs.source_commit }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify installed ARM SDK and runtime only
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun simctl list runtimes
      - run: python3 iosapp/Glass72Diagnostic/stage.py
      - name: Compile and run only three short top leaves
        run: python3 iosapp/Glass72Diagnostic/run.py
      - name: OCR original exported PNGs
        if: always()
        run: swift iosapp/Glass72Diagnostic/ocr.swift "${RUNNER_TEMP}/glass72-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: glass72-${{ inputs.source }}-ios
          path: ${{ runner.temp }}/glass72-evidence
          retention-days: 7
          if-no-files-found: error
