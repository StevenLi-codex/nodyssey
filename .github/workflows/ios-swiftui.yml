name: Glass71 disposable iOS integration (no archive)
on:
  workflow_dispatch:
    inputs:
      archive:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, union]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DIAG_SOURCE: ${{ matrix.source }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify installed SDK/runtime without downloads
        run: |
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
      - run: python3 iosapp/Glass71Diagnostic/stage.py
      - name: Compile smoke then actual iOS matrix
        run: python3 iosapp/Glass71Diagnostic/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: glass71-${{ matrix.source }}-ios
          path: ${{ runner.temp }}/glass71-evidence
          retention-days: 7
          if-no-files-found: error
