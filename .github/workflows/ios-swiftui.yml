name: Focused reply keyboard diagnostic (no IPA)
on:
  workflow_dispatch:
    inputs:
      archive:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stage disclosed production-sheet fixture
        run: |
          python3 iosapp/ReplyKeyboardDiagnostic/stage.py
          xcodebuild -version
          xcrun simctl list devices available
      - name: Exercise actual UIKit keyboard in iOS Simulator
        run: |
          python3 - <<'PY'
          import subprocess,json,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          phone=next(d for r,ds in devices.items() if '.iOS-' in r for d in ds if 'iPhone' in d['name'] and d['isAvailable'])
          subprocess.run(['defaults','write','com.apple.iphonesimulator','ConnectHardwareKeyboard','-bool','false'],check=True)
          subprocess.run(['xcrun','simctl','boot',phone['udid']],check=False)
          subprocess.run(['xcrun','simctl','bootstatus',phone['udid'],'-b'],check=True)
          command=['xcodebuild','test','-project',os.environ['RUNNER_TEMP']+'/ReplyKeyboard/iosapp/Nodyssey.xcodeproj','-scheme','Nodyssey','-configuration','Debug','-destination','platform=iOS Simulator,id='+phone['udid'],'-derivedDataPath',os.environ['RUNNER_TEMP']+'/ReplyDerived','-resultBundlePath',os.environ['RUNNER_TEMP']+'/reply-keyboard.xcresult','-only-testing:NativeNavigationUITests/NativeNavigationUITests/testShortReplyWithSoftwareKeyboard','-parallel-testing-enabled','NO','CODE_SIGNING_ALLOWED=NO','CODE_SIGNING_REQUIRED=NO','ASSETCATALOG_COMPILER_APPICON_NAME=']
          subprocess.run(command,check=True)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reply-keyboard-diagnostic
          path: |
            ${{ runner.temp }}/reply-keyboard.xcresult
            ${{ runner.temp }}/ReplyKeyboard/sources.json
          retention-days: 7
