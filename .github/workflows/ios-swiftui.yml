name: Focused home row diagnostic (no IPA)
on:
  workflow_dispatch:
    inputs:
      archive:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  rows:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stage exact production feed and row
        run: |
          python3 iosapp/HomeRowDiagnostic/stage.py
          xcodebuild -version
      - name: Exercise production row with real iOS hit testing
        run: |
          python3 - <<'PY'
          import subprocess,json,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          phone=next(d for r,ds in devices.items() if '.iOS-' in r for d in ds if 'iPhone' in d['name'] and d['isAvailable'])
          subprocess.run(['xcrun','simctl','boot',phone['udid']],check=False)
          subprocess.run(['xcrun','simctl','bootstatus',phone['udid'],'-b'],check=True)
          command=['xcodebuild','test','-project',os.environ['RUNNER_TEMP']+'/HomeRow/iosapp/Nodyssey.xcodeproj','-scheme','Nodyssey','-configuration','Debug','-destination','platform=iOS Simulator,id='+phone['udid'],'-derivedDataPath',os.environ['RUNNER_TEMP']+'/HomeDerived','-resultBundlePath',os.environ['RUNNER_TEMP']+'/home-row.xcresult','-only-testing:NativeNavigationUITests','-parallel-testing-enabled','NO','CODE_SIGNING_ALLOWED=NO','CODE_SIGNING_REQUIRED=NO','ASSETCATALOG_COMPILER_APPICON_NAME=']
          subprocess.run(command,check=True)
          PY
      - name: Export actual XCTest summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/home-row.xcresult" > "$RUNNER_TEMP/summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/home-row.xcresult" > "$RUNNER_TEMP/tests.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: home-row-diagnostic
          path: |
            ${{ runner.temp }}/home-row.xcresult
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/tests.json
            ${{ runner.temp }}/HomeRow/sources.json
            ${{ runner.temp }}/HomeRow/source-union.json
          retention-days: 7
