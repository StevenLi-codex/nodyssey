name: iOS unsigned archive only

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Marketing version
        required: true
        default: "1.2.31"
        type: string
      build_number:
        description: Build number
        required: true
        default: "73"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-archive-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Apple toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ios-archive-konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ios-archive-konan-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Build unsigned iPhone archive
        run: |
          xcodebuild -project iosapp/Nodyssey.xcodeproj -scheme Nodyssey \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nodyssey.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          grep -F '** ARCHIVE SUCCEEDED **' "$RUNNER_TEMP/xcodebuild-archive.log"
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Nodyssey.xcarchive/Products/Applications/Nodyssey.app" "$RUNNER_TEMP/Payload/"
          IPA="$RUNNER_TEMP/Nodyssey-${{ inputs.marketing_version }}-build${{ inputs.build_number }}-unsigned.ipa"
          (cd "$RUNNER_TEMP" && zip -qry "$IPA" Payload)
          shasum -a 256 "$IPA"
          printf '%s\n' "$IPA" > "$RUNNER_TEMP/ipa-path.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: nodyssey-${{ inputs.marketing_version }}-build${{ inputs.build_number }}-unsigned-ipa
          path: ${{ runner.temp }}/Nodyssey-${{ inputs.marketing_version }}-build${{ inputs.build_number }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: nodyssey-${{ inputs.marketing_version }}-build${{ inputs.build_number }}-archive-evidence
          path: |
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/ipa-path.txt
            ${{ runner.temp }}/Nodyssey.xcarchive/Info.plist
          if-no-files-found: error
          retention-days: 14
      - name: Stop Gradle daemons
        if: always()
        run: ./gradlew --stop
